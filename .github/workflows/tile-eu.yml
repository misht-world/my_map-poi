name: Tile Europe (tippecanoe → PMTiles)

# Ручной запуск. Берёт вход (europe.geojsonseq.gz из релиза europe-src), тайлит через
# tippecanoe в PMTiles, кладёт в релиз europe-tiles И СРАЗУ деплоит Pages вторым job'ом
# (needs: tile) — так деплой всегда идёт ПОСЛЕ готового файла, без гонки с pages.yml.
# Тяжёлый пайплайн (дамп/парс/enrich) идёт на ПК — CI только тайлит (tippecanoe тривиален).

on:
  workflow_dispatch:

jobs:
  tile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev zlib1g-dev

      - name: Build tippecanoe
        run: |
          git clone --depth 1 https://github.com/felt/tippecanoe.git
          cd tippecanoe && make -j"$(nproc)" && sudo make install
          tippecanoe --version

      - name: Download input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download europe-src --repo "$GITHUB_REPOSITORY" -p 'europe.geojsonseq.gz'
          gunzip europe.geojsonseq.gz
          wc -l europe.geojsonseq

      - name: Tile → PMTiles
        run: |
          tippecanoe -o europe.pmtiles -Z2 -z14 -l poi \
            -r1 --drop-densest-as-needed --extend-zooms-if-still-dropping \
            --order-descending-by=score \
            -M 2500000 --no-feature-limit --force europe.geojsonseq
          ls -lh europe.pmtiles

      - name: Publish PMTiles to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view europe-tiles --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create europe-tiles --repo "$GITHUB_REPOSITORY" --title "Europe PMTiles" --notes "Векторные тайлы POI Европы (PMTiles). Обновляется workflow tile-eu.yml."
          gh release upload europe-tiles europe.pmtiles --repo "$GITHUB_REPOSITORY" --clobber

  # Деплой Pages — отдельный job, стартует только после успешного tile (needs: tile),
  # то есть когда новый PMTiles уже в релизе. Гонки с pages.yml нет: тот же concurrency-group.
  deploy:
    needs: tile
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/config _site/data/normalized
          cp web/*.html web/*-meta.json _site/ 2>/dev/null || cp web/*.html _site/
          cp config/scoring.json config/poi-types.json _site/config/
          cp data/normalized/*.geojson _site/data/normalized/
          # PMTiles из релиза europe-tiles (обновлён предыдущим job'ом) — same-origin для веба.
          gh release download europe-tiles --repo "$GITHUB_REPOSITORY" -p 'europe.pmtiles' -D _site
          ls -lh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
